<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>How much do I need to retire?</title>
<style>
  /* Phone frame for desktop user testing. The lesson loads in the iframe
     at phone width (402px, an iPhone 16 Pro), so it shows its own mobile
     layout. Same file for both prototypes: only lesson.html differs. */
  :root { --bg: #f4f4f4; --edge: #d9dcdc; --ink: #111; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .phone { width: 402px; max-width: 100%; height: min(874px, calc(100vh - 48px));
    display: flex; flex-direction: column; background: #fff; border-radius: 44px;
    box-shadow: 0 0 0 1px var(--edge), 0 10px 40px rgba(0,0,0,.08);
    overflow: hidden; }
  .status { flex: 0 0 auto; height: 46px; display: flex; align-items: center;
    justify-content: space-between; padding: 4px 28px 0 34px; background: #fff;
    color: var(--ink); font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .icons { display: flex; align-items: center; gap: 6px; }
  .icons svg { display: block; }
  iframe { flex: 1 1 auto; width: 100%; border: 0; display: block; background: #fff; }
  /* On a real phone or a narrow window, skip the frame and show the lesson full screen */
  @media (max-width: 500px) {
    body { padding: 0; }
    .phone { width: 100%; height: 100vh; height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
    .status { display: none; }
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="status" aria-hidden="true">
      <span>9:41</span>
      <span class="icons">
        <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0z" fill="currentColor"/><path d="M3.4 6.8a6.5 6.5 0 0 1 9.2 0l-1.3 1.3a4.7 4.7 0 0 0-6.6 0z" fill="currentColor"/><path d="M1.1 4.5a9.8 9.8 0 0 1 13.8 0l-1.3 1.3a8 8 0 0 0-11.2 0z" fill="currentColor"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" fill="currentColor" opacity=".4"/></svg>
      </span>
    </div>
    <iframe src="lesson.html" title="Lesson"></iframe>
  </div>
<script>
  /* Hide the lesson's scrollbar so the frame reads like a phone (it still
     scrolls with the mouse wheel or trackpad). Works because lesson.html is
     on the same site; if it ever isn't, the lesson just keeps its scrollbar. */
  var f = document.querySelector('iframe');
  f.addEventListener('load', function () {
    try {
      var d = f.contentDocument, st = d.createElement('style');
      st.textContent = 'html{scrollbar-width:none}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}';
      d.head.appendChild(st);
      d.title && (document.title = d.title);
    } catch (e) {}
  });
</script>
</body>
</html>
